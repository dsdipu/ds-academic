<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" role="img" aria-label="DS Academic Logo">
  <!-- DS Icon Box -->
  <rect x="0" y="4" width="32" height="32" rx="7" fill="url(#grad1)"/>
  <text x="16" y="25" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="14" fill="white" text-anchor="middle" letter-spacing="-0.5">DS</text>

  <!-- "Academic" wordmark -->
  <text x="44" y="17" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="14" fill="#1A5F7A" letter-spacing="-0.3">DS</text>
  <text x="44" y="31" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="10" fill="#22A699" letter-spacing="1.5">ACADEMIC</text>

  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A5F7A"/>
      <stop offset="100%" stop-color="#22A699"/>
    </linearGradient>
  </defs>
</svg>
